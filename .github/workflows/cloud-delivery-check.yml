name: Cloud delivery contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/cloud-delivery.test.mjs
      - run: bash -n scripts/upload-cloud-drive.sh

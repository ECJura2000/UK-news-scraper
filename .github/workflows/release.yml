name: release executables

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v2*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirement-lock.txt
            requirement-dev.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/apps/desktop/package-lock.json
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement-lock.txt -r requirement-dev.txt
      - name: Verify tag and source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v2* ]]; then
            version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          python -m ruff check .
          python -m compileall -q UK_news_scraper run_scraper.py scripts/package_release.py scripts/package_source.py scripts/check_release_size.py
          python -m UK_news_scraper --check-runtime
          python -m pytest -q
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate desktop frontend
        working-directory: native/apps/desktop
        run: npm ci && npm test && npm run build

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: UKNewsScraper-Linux
            release-label: Linux-x86_64
          - os: macos-latest
            platform: macos
            artifact: UKNewsScraper-macOS
            release-label: macOS
          - os: windows-latest
            platform: windows
            artifact: UKNewsScraper-Windows
            release-label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/apps/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build React frontend
        working-directory: native/apps/desktop
        run: npm ci && npm run build
      - name: Build native Rust executable
        run: cargo build --release --locked -p uk-news-scraper
      - name: Stage native executable
        shell: bash
        run: |
          mkdir -p dist
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp target/release/UKNewsScraper.exe dist/UKNewsScraper.exe
          else
            cp target/release/UKNewsScraper dist/UKNewsScraper
            chmod +x dist/UKNewsScraper
          fi
      - name: Smoke-test Linux or macOS executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/UKNewsScraper --check-runtime > dist/smoke-standard.txt
          test -s dist/smoke-standard.txt
      - name: Smoke-test Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = @(@{ Name = "standard"; Executable = ".\dist\UKNewsScraper.exe" })
          foreach ($test in $tests) {
            $stdout = Join-Path $PWD "dist\smoke-$($test.Name)-stdout.txt"
            $stderr = Join-Path $PWD "dist\smoke-$($test.Name)-stderr.txt"
            $process = Start-Process `
              -FilePath (Resolve-Path $test.Executable).Path `
              -ArgumentList "--check-runtime" `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            Write-Host "$($test.Name) exit code: $($process.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) {
              throw "$($test.Name) executable exited with code $($process.ExitCode)"
            }
            if (-not (Test-Path $stdout) -or (Get-Item $stdout).Length -eq 0) {
              throw "$($test.Name) executable produced no runtime-check output"
            }
          }
      - name: Upload Windows smoke diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: UKNewsScraper-Windows-diagnostics
          path: |
            dist/smoke-*-stdout.txt
            dist/smoke-*-stderr.txt
            build/UKNewsScraper/warn-UKNewsScraper.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Create portable archive
        run: python scripts/package_release.py ${{ matrix.platform }}
      - name: Enforce platform asset size budget
        shell: bash
        run: >-
          python scripts/check_release_size.py
          dist/release/UKNewsScraper-*-${{ matrix.release-label }}.zip
          --max-file-mib 35
          --max-total-mib 35
          --manifest dist/release/${{ matrix.artifact }}-SIZE-MANIFEST.txt
      - name: Build desktop installer on target operating system
        shell: bash
        working-directory: native/apps/desktop
        run: |
          case "$RUNNER_OS" in
            Linux) npm exec tauri build -- --features desktop-default --bundles deb appimage --ci ;;
            macOS) npm exec tauri build -- --features desktop-default --bundles app --ci --no-sign ;;
            Windows) npm exec tauri build -- --features desktop-default --bundles nsis --ci ;;
          esac
      - name: Smoke-test desktop executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            target/release/UKNewsScraper.exe --check-runtime > dist/smoke-desktop.txt
          else
            target/release/UKNewsScraper --check-runtime > dist/smoke-desktop.txt
          fi
          test -s dist/smoke-desktop.txt
      - name: Stage desktop installer
        shell: bash
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          bundle_root="target/release/bundle"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            app="$(find "$bundle_root/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"
            test -n "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist/release/UKNewsScraper-${version}-macOS-Desktop.zip"
            test -s "dist/release/UKNewsScraper-${version}-macOS-Desktop.zip"
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            installer="$(find "$bundle_root/nsis" -maxdepth 1 -name '*.exe' -type f -print -quit)"
            test -n "$installer"
            cp "$installer" "dist/release/UKNewsScraper-${version}-Windows-Setup.exe"
          else
            deb="$(find "$bundle_root/deb" -maxdepth 1 -name '*.deb' -type f -print -quit)"
            appimage="$(find "$bundle_root/appimage" -maxdepth 1 -name '*.AppImage' -type f -print -quit)"
            test -n "$deb" && test -n "$appimage"
            cp "$deb" "dist/release/UKNewsScraper-${version}-Linux-x86_64.deb"
            cp "$appimage" "dist/release/UKNewsScraper-${version}-Linux-x86_64.AppImage"
          fi
      - name: Enforce desktop installer size budget
        shell: bash
        run: >-
          python scripts/check_release_size.py
          dist/release
          --max-file-mib 35
          --max-total-mib 140
          --manifest dist/release/${{ matrix.artifact }}-SIZE-MANIFEST.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/release/*.zip
            dist/release/*.deb
            dist/release/*.AppImage
            dist/release/*-Setup.exe
            dist/release/*-SIZE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v2')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v2* ]]; then
            tag="$GITHUB_REF_NAME"
            verify_tag="true"
          else
            version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
            tag="v${version}"
            verify_tag="false"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "verify_tag=$verify_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          pattern: UKNewsScraper-*
          path: release-assets
          merge-multiple: true
      - name: Create tracked source archive
        run: >-
          python scripts/package_source.py
          --output-dir release-assets
          --ref "$GITHUB_SHA"
      - name: Verify release assets
        run: |
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 5
          test "$(find release-assets -maxdepth 1 -name '*-Source.zip' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.deb' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*.AppImage' -type f | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -name '*-Setup.exe' -type f | wc -l)" -eq 1
      - name: Create consolidated checksum and enforce release size budget
        shell: bash
        run: |
          cd release-assets
          sha256sum ./*.zip ./*.deb ./*.AppImage ./*-Setup.exe > UKNewsScraper-${{ steps.release.outputs.tag }}-SHA256SUMS.txt
          rm -f ./*-SIZE-MANIFEST.txt
          cd ..
          python scripts/check_release_size.py release-assets \
            --max-file-mib 35 \
            --max-total-mib 140 \
            --manifest release-assets/UKNewsScraper-${{ steps.release.outputs.tag }}-SIZE-MANIFEST.txt
      - name: Publish release when absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; publication skipped."
            exit 0
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          tag_args=(--target "$GITHUB_SHA")
          if [[ "$VERIFY_TAG" == "true" ]]; then
            tag_args=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --generate-notes \
            --title "UK News Scraper $RELEASE_TAG" \
            --notes "此版本提供 Windows、macOS 與 Linux x86_64 可攜版、桌面安裝包及 Source ZIP。所有下載檔均納入 SHA-256 清單，單一成品受 35 MiB 容量閘門保護。"

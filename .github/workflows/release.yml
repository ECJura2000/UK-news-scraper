name: release executables

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirement-lock.txt
            requirement-dev.txt
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirement-lock.txt -r requirement-dev.txt
      - name: Verify tag and source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$(python -c 'from UK_news_scraper import __version__; print(__version__)')"
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          python -m ruff check .
          python -m compileall -q UK_news_scraper run_scraper.py run_scraper_protected.py scripts/package_release.py scripts/package_source.py scripts/check_release_size.py
          python -m pytest -q

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact: UKNewsScraper-Linux
            release-label: Linux-x86_64
          - os: macos-latest
            platform: macos
            artifact: UKNewsScraper-macOS
            release-label: macOS
          - os: windows-latest
            platform: windows
            artifact: UKNewsScraper-Windows
            release-label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement-build.txt
      - name: Build Linux executables
        if: runner.os == 'Linux'
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh
      - name: Build macOS executables
        if: runner.os == 'macOS'
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh
      - name: Build Windows executables
        if: runner.os == 'Windows'
        shell: cmd
        run: build_windows.bat
      - name: Smoke-test Linux or macOS executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/UKNewsScraper --check-runtime > dist/smoke-standard.txt
          ./dist/UKNewsScraper_protected --check-runtime > dist/smoke-protected.txt
          test -s dist/smoke-standard.txt
          test -s dist/smoke-protected.txt
      - name: Smoke-test Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tests = @(
            @{ Name = "standard"; Executable = ".\dist\UKNewsScraper.exe" },
            @{ Name = "protected"; Executable = ".\dist\UKNewsScraper_protected.exe" }
          )
          foreach ($test in $tests) {
            $stdout = Join-Path $PWD "dist\smoke-$($test.Name)-stdout.txt"
            $stderr = Join-Path $PWD "dist\smoke-$($test.Name)-stderr.txt"
            $process = Start-Process `
              -FilePath (Resolve-Path $test.Executable).Path `
              -ArgumentList "--check-runtime" `
              -Wait `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
            Write-Host "$($test.Name) exit code: $($process.ExitCode)"
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            if ($process.ExitCode -ne 0) {
              throw "$($test.Name) executable exited with code $($process.ExitCode)"
            }
            if (-not (Test-Path $stdout) -or (Get-Item $stdout).Length -eq 0) {
              throw "$($test.Name) executable produced no runtime-check output"
            }
          }
      - name: Upload Windows smoke diagnostics
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: UKNewsScraper-Windows-diagnostics
          path: |
            dist/smoke-*-stdout.txt
            dist/smoke-*-stderr.txt
            build/UKNewsScraper/warn-UKNewsScraper.txt
            build/UKNewsScraper_protected/warn-UKNewsScraper_protected.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Create portable archive
        run: python scripts/package_release.py ${{ matrix.platform }}
      - name: Enforce platform asset size budget
        shell: bash
        run: >-
          python scripts/check_release_size.py
          dist/release/UKNewsScraper-*-${{ matrix.release-label }}.zip
          --max-file-mib 100
          --max-total-mib 100
          --manifest dist/release/${{ matrix.artifact }}-SIZE-MANIFEST.txt
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/release/*.zip
            dist/release/*-SIZE-MANIFEST.txt
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            verify_tag="true"
          else
            version="$(python -c 'from UK_news_scraper import __version__; print(__version__)')"
            tag="v${version}"
            verify_tag="false"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "verify_tag=$verify_tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        with:
          pattern: UKNewsScraper-*
          path: release-assets
          merge-multiple: true
      - name: Create tracked source archive
        run: >-
          python scripts/package_source.py
          --output-dir release-assets
          --ref "$GITHUB_SHA"
      - name: Verify release assets
        run: |
          find release-assets -maxdepth 1 -type f -print
          test "$(find release-assets -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 4
          test "$(find release-assets -maxdepth 1 -name '*-Source.zip' -type f | wc -l)" -eq 1
      - name: Create consolidated checksum and enforce release size budget
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip > UKNewsScraper-${{ steps.release.outputs.tag }}-SHA256SUMS.txt
          rm -f *-SIZE-MANIFEST.txt
          cd ..
          python scripts/check_release_size.py release-assets \
            --max-file-mib 100 \
            --max-total-mib 220 \
            --manifest release-assets/UKNewsScraper-${{ steps.release.outputs.tag }}-SIZE-MANIFEST.txt
      - name: Publish release when absent
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERIFY_TAG: ${{ steps.release.outputs.verify_tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; publication skipped."
            exit 0
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0)
          tag_args=(--target "$GITHUB_SHA")
          if [[ "$VERIFY_TAG" == "true" ]]; then
            tag_args=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --generate-notes \
            --title "UK News Scraper $RELEASE_TAG" \
            --notes "此版本提供不需要安裝 Python 的 Windows、macOS 與 Linux x86_64 可攜版，以及可交給 AI 工具安裝與執行的 Source ZIP。所有下載檔均納入 SHA-256 清單，並受單檔 100 MiB、總量 220 MiB 容量閘門保護。"

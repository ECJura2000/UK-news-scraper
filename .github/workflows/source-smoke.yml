name: source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "29 20 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      retry: ${{ steps.check.outputs.retry }}
    steps: &smoke-steps
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirement-lock.txt
      - name: Check production sources
        id: check
        shell: bash
        run: |
          report=新聞放置區/source-smoke.json
          status=0
          python -m scripts.smoke_sources --output "$report" || status=$?
          if [[ "$status" == 1 && "$GITHUB_JOB" == smoke ]] &&
             jq -e '.retryable_google_news_failure == true' "$report" >/dev/null; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Google News transport failed; checking again on a fresh runner."
            exit 0
          fi
          exit "$status"
      - name: Preserve source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job == 'smoke' && 'source-smoke-evidence' || 'source-smoke-retry-evidence' }}${{ github.run_attempt != '1' && format('-attempt-{0}', github.run_attempt) || '' }}
          path: 新聞放置區/source-smoke.json
          if-no-files-found: error
          retention-days: 7

  retry:
    needs: smoke
    if: needs.smoke.outputs.retry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps: *smoke-steps

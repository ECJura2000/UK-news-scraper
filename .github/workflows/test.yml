name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirement-lock.txt
            requirement-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirement-lock.txt -r requirement-dev.txt
      - run: python -m pytest -q
      - run: python -m compileall -q UK_news_scraper tests

  build:
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement-build.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirement-build.txt
      - run: python -m PyInstaller --clean --onefile --name UKNewsScraper run_scraper.py
      - run: python -m PyInstaller --clean --onefile --name UKNewsScraper_protected run_scraper_protected.py
      - uses: actions/upload-artifact@v4
        with:
          name: UKNewsScraper-${{ runner.os }}
          path: dist/*

name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirement-lock.txt
            requirement-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirement-lock.txt -r requirement-dev.txt
      - run: python -m pytest -q --cov=UK_news_scraper.dedupe --cov=UK_news_scraper.scrapers.ministry.utils.date --cov-fail-under=80
      - run: python -m compileall -q UK_news_scraper tests
      - run: python -m ruff check UK_news_scraper tests scripts
      # deep-translator has no fixed release for PYSEC-2022-252; keep all other findings blocking.
      - name: Audit locked dependencies
        run: python -m pip_audit -r requirement-lock.txt --ignore-vuln PYSEC-2022-252 --format json --output pip-audit.json
      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uk-news-pip-audit
          path: pip-audit.json
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirement-build.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirement-build.txt
      - run: python -m PyInstaller --clean --noconfirm --onefile --collect-data tzdata --name UKNewsScraper run_scraper.py
      - uses: actions/upload-artifact@v7
        with:
          name: UKNewsScraper-${{ runner.os }}
          path: dist/*

  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: native/apps/desktop/package-lock.json
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
        working-directory: native/apps/desktop
      - run: npm test
        working-directory: native/apps/desktop
      - run: npm run build
        working-directory: native/apps/desktop
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/benchmark_capacity.py --sizes 1000 10000 --workers 1 4 6 > benchmark-results.json
      - run: python scripts/check_benchmark_budget.py benchmark-results.json benchmarks/baseline.json
      - uses: actions/upload-artifact@v7
        with:
          name: uk-news-benchmark-results
          path: benchmark-results.json

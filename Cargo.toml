[workspace]
members = [
  "native/crates/uk-news-core",
  "native/crates/uk-news-sources",
  "native/crates/uk-news-export",
  "native/crates/uk-news-app",
  "native/apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/ECJura2000/UK-news-scraper"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli"] }
scraper = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

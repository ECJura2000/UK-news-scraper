[package]
name = "uk-news-scraper"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "UKNewsScraper"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
chrono.workspace = true
chrono-tz = "0.10"

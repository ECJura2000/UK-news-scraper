serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio.workspace = true
uk-news-app = { path = "../../../crates/uk-news-app" }
uk-news-core = { path = "../../../crates/uk-news-core" }
uk-news-export = { path = "../../../crates/uk-news-export" }
uk-news-sources = { path = "../../../crates/uk-news-sources" }

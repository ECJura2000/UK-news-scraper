[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# Keep existing enum stringification in serialized delivery identifiers.
ignore = ["UP042"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["UK_news_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
